<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gương Thần - Lõi Three.js Thuần</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
      
      /* Vùng chứa không gian AR */
      #container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
      
      #status-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.95); color: #3b82f6; padding: 10px 24px; z-index: 9999; border-radius: 99px; font-size: 13px; font-weight: bold; white-space: nowrap; border: 1px solid #3b82f6; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: opacity 0.5s; }
      #studio-panel { position: absolute; bottom: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 100; pointer-events: none; }
      .control-row { display: flex; gap: 10px; pointer-events: auto; justify-content: center; }
      .control-btn { background: rgba(15, 23, 42, 0.95); color: #fff; border: 1px solid #ec4899; padding: 12px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
      .control-btn:active { transform: scale(0.9); background: #ec4899; }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-face-three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const statusBox = document.getElementById('status-box');
      const urlParams = new URLSearchParams(window.location.search);
      const rawTextureUrl = urlParams.get('texture');
      const glbUrl = 'https://panphxziqtkvtjffwhlc.supabase.co/storage/v1/object/public/assets/masks/face_taktical__mask.glb';

      let activeMesh = null;
      let currentScale = 0.0015;

      // Đẩy hàm điều khiển ra toàn cục (Window) để nút bấm HTML nhận được lệnh
      window.adjust = function(type, value) {
         if (!activeMesh) return;
         if (type === 'scale') { 
            currentScale *= value; 
            activeMesh.scale.set(currentScale, currentScale, currentScale); 
         }
         else if (type === 'y') { activeMesh.position.y += value; }
         else if (type === 'z') { activeMesh.position.z += value; }
      }

      // Khởi tạo Lõi AR
      const mindarThree = new MindARThree({
         container: document.querySelector("#container"),
      });
      const {renderer, scene, camera} = mindarThree;

      // Tạo mỏ neo trên chóp mũi (Anchor Index: 1)
      const anchor = mindarThree.addAnchor(1);

      statusBox.innerHTML = "⏳ Đang tải mô hình 3D...";

      // Tải phôi mặt nạ
      const loader = new GLTFLoader();
      loader.load(glbUrl, (gltf) => {
         const mesh3D = gltf.scene;
         
         // Đặt kích thước và tọa độ vàng
         mesh3D.scale.set(0.0015, 0.0015, 0.0015);
         mesh3D.position.set(0, 0.1, 0); 
         activeMesh = mesh3D;

         // Sơn chất liệu phẳng
         const applyMaterial = (texture = null) => {
            mesh3D.traverse((node) => {
               if (node.isMesh) {
                  node.material = new THREE.MeshBasicMaterial({
                     map: texture,
                     color: texture ? 0xffffff : 0xdddddd,
                     transparent: true,
                     side: THREE.DoubleSide
                  });
                  node.material.needsUpdate = true;
               }
            });
         };

         applyMaterial(null);
         
         // Gắn chặt mặt nạ vào mỏ neo của mũi
         anchor.group.add(mesh3D);

         if (!rawTextureUrl) {
            statusBox.innerHTML = "✨ Đã nạp xong! Đang chờ Camera...";
            return;
         }

         statusBox.innerHTML = "🎨 Đang hòa trộn họa tiết AI...";
         const texLoader = new THREE.TextureLoader();
         texLoader.crossOrigin = 'anonymous';
         
         // Tải Skin AI (Sử dụng cổng proxy an toàn cho ảnh)
         const safeSkinUrl = 'https://wsrv.io/?url=' + encodeURIComponent(rawTextureUrl) + '&output=png';
         texLoader.load(safeSkinUrl, (tex) => {
            tex.flipY = false;
            applyMaterial(tex);
            statusBox.innerHTML = "✨ Đã sẵn sàng AR!";
         }, undefined, () => {
            texLoader.load(rawTextureUrl, (tex2) => {
               tex2.flipY = false;
               applyMaterial(tex2);
               statusBox.innerHTML = "✨ Đã sẵn sàng AR!";
            });
         });
      }, undefined, (err) => {
         statusBox.innerHTML = "❌ Lỗi kết nối tải phôi 3D!";
         statusBox.style.color = "#ef4444";
      });

      // HÀM KÍCH HOẠT CAMERA VÀ ĐỒ HỌA
      const startAR = async () => {
         try {
            await mindarThree.start(); // Chờ Apple cấp quyền xong mới làm tiếp
            statusBox.innerHTML = "🎯 Đã nhận diện khuôn mặt!";
            statusBox.style.color = "#22c55e";
            statusBox.style.borderColor = "#22c55e";
            setTimeout(() => { statusBox.style.opacity = '0'; }, 2000);
            
            // Ép card đồ họa xuất hình (60 FPS)
            renderer.setAnimationLoop(() => {
               renderer.render(scene, camera);
            });
         } catch (error) {
            statusBox.innerHTML = "❌ Bị từ chối quyền Camera!";
            statusBox.style.color = "#ef4444";
         }
      }

      // Tự động khởi chạy ngay khi mở trang
      startAR();
    </script>
  </head>
  <body>
    <div id="container"></div>

    <div id="status-box">Đang khởi tạo hệ thống...</div>

    <div id="studio-panel">
       <div class="control-row">
          <button class="control-btn" onclick="adjust('scale', 1.1)">➕ Phóng to</button>
          <button class="control-btn" onclick="adjust('scale', 0.9)">➖ Thu nhỏ</button>
       </div>
       <div class="control-row">
          <button class="control-btn" onclick="adjust('y', 0.05)">⬆️ Đẩy lên cao</button>
          <button class="control-btn" onclick="adjust('y', -0.05)">⬇️ Kéo xuống</button>
       </div>
       <div class="control-row">
          <button class="control-btn" onclick="adjust('z', -0.05)">⏬ Ôm sát vào mặt</button>
          <button class="control-btn" onclick="adjust('z', 0.05)">⏫ Đẩy ra xa</button>
       </div>
    </div>
  </body>
</html>
