<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Khám Phá - Xưởng Cầm Cổ Vật</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
    
    #video-input { position: absolute; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
    #canvas-output { position: absolute; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }

    #status-box { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.85); color: #38bdf8; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: bold; white-space: nowrap; border: 1px solid #38bdf8; box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 10; text-align: center; line-height: 1.5; pointer-events: none;}

    /* UI BẢNG ĐIỀU KHIỂN TỐI GIẢN DỄ DÙNG 1 TAY */
    #ui-container { position: absolute; bottom: 20px; left: 0; width: 100vw; z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;}
    
    #control-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid #f59e0b; border-radius: 20px; padding: 15px 20px; width: calc(100vw - 60px); max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(150%); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; }
    #control-panel.show { transform: translateY(0); }
    
    .slider-group { margin-bottom: 12px; }
    .slider-group:last-child { margin-bottom: 0; }
    .slider-group label { display: flex; justify-content: space-between; color: #cbd5e1; font-size: 11px; margin-bottom: 6px; font-weight: bold; text-transform: uppercase;}
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 20px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -7px; box-shadow: 0 0 10px rgba(245, 158, 11, 0.8); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #475569; border-radius: 3px; }
    
    .fab-group { display: flex; gap: 20px; pointer-events: auto; margin-bottom: 10px;}
    .fab-btn { width: 50px; height: 50px; border-radius: 50%; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; backdrop-filter: blur(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
    .fab-btn:active { transform: scale(0.9); }
    #cam-btn { background: rgba(51, 65, 85, 0.9); border: 2px solid #cbd5e1; }
    #settings-btn { background: linear-gradient(135deg, #f59e0b, #ea580c); border: 2px solid #fcd34d; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <video id="video-input" autoplay playsinline></video>
  <canvas id="canvas-output"></canvas>
  <div id="status-box">⏳ Đang khởi động lõi AI...</div>

  <div id="ui-container">
    <div id="control-panel" class="show">
       <h4 style="color:#f59e0b; margin: 0 0 10px 0; text-align:center;">ĐIỀU CHỈNH CỔ VẬT</h4>
       <!-- Mở rộng giới hạn Scale lên 10 để tránh file bị nén quá nhỏ -->
       <div class="slider-group"><label><span>🔍 Phóng to/Thu nhỏ</span></label><input type="range" id="scale-slider" min="0.1" max="10" step="0.1" value="1.5"></div>
       <div class="slider-group"><label><span>↔ Trái / Phải</span></label><input type="range" id="posX-slider" min="-3" max="3" step="0.05" value="0"></div>
       <div class="slider-group"><label><span>↕ Dọc cánh tay</span></label><input type="range" id="posY-slider" min="-3" max="3" step="0.05" value="0"></div>
       <div class="slider-group"><label><span>↗ Nổi / Chìm</span></label><input type="range" id="posZ-slider" min="-3" max="3" step="0.05" value="0"></div>
       <div class="slider-group"><label><span>↶ Lật đứng vòng</span></label><input type="range" id="rotX-slider" min="-3.14" max="3.14" step="0.05" value="1.57"></div>
       <div class="slider-group"><label><span>⤴ Xoay ngang</span></label><input type="range" id="rotY-slider" min="-3.14" max="3.14" step="0.05" value="0"></div>
    </div>
    <div class="fab-group">
      <button id="cam-btn" class="fab-btn" title="Đổi Camera">🔄</button>
      <button id="settings-btn" class="fab-btn" title="Ẩn/Hiện Menu">⚙️</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const videoElement = document.getElementById('video-input');
    const canvasElement = document.getElementById('canvas-output');
    const statusBox = document.getElementById('status-box');
    let isFrontCamera = true; 
    let cameraUtils = null;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(0, 5, 5);
    scene.add(dirLight);

    // GỐC TỌA ĐỘ TAY
    const wristNode = new THREE.Group();
    wristNode.visible = false;
    scene.add(wristNode);

    // KHỐI TÀNG HÌNH OVAL (Đã đẩy lùi sâu vào da để không bao giờ cắt mất mặt trước của vòng)
    const occluderGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); 
    const occluderMat = new THREE.MeshBasicMaterial({ colorWrite: false }); 
    const occluderMesh = new THREE.Mesh(occluderGeo, occluderMat);
    occluderMesh.renderOrder = -1;   
    occluderMesh.rotation.x = Math.PI / 2; 
    wristNode.add(occluderMesh);

    // NHÓM CHỨA CỔ VẬT
    let artifactMesh = new THREE.Group(); 
    wristNode.add(artifactMesh);

    const urlParams = new URLSearchParams(window.location.search);
    const glbUrl = urlParams.get('model');

    if (glbUrl) {
      const loader = new GLTFLoader();
      loader.load(glbUrl, (gltf) => {
         const model = gltf.scene;
         
         // CHỈ lấy kích thước để Scale, TUYỆT ĐỐI KHÔNG dời tâm (position) để giữ nguyên gốc của Artist
         const box = new THREE.Box3().setFromObject(model);
         const size = box.getSize(new THREE.Vector3());
         
         const maxDim = Math.max(size.x, size.y, size.z);
         const scale = 1.0 / maxDim; 
         model.scale.set(scale, scale, scale);
         
         artifactMesh.add(model);
      });
    }

    document.getElementById('settings-btn').onclick = () => {
      document.getElementById('control-panel').classList.toggle('show');
    };

    // LÕI AI NHẬN DIỆN MƯỢT MÀ
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

    const get3DPos = (landmark) => {
      let xPos = isFrontCamera ? ((1 - landmark.x) * 2) - 1 : (landmark.x * 2) - 1;
      let yPos = -(landmark.y * 2) + 1;
      const vector = new THREE.Vector3(xPos, yPos, 0.5);
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    };

    const targetPosition = new THREE.Vector3();
    const targetQuaternion = new THREE.Quaternion();
    let hasPreviousFrame = false;

    // KẾT NỐI TOÁN HỌC & SLIDER
    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusBox.style.display = 'none';

        const landmarks = results.multiHandLandmarks[0];
        const wrist = get3DPos(landmarks[0]);      
        const middleMCP = get3DPos(landmarks[9]);  
        const indexMCP = get3DPos(landmarks[5]);   
        const pinkyMCP = get3DPos(landmarks[17]); 

        const palmSize = wrist.distanceTo(middleMCP);

        // KHUNG XƯƠNG CỨNG
        const armAxisY = new THREE.Vector3().subVectors(middleMCP, wrist).normalize(); 
        const palmAxisX = new THREE.Vector3().subVectors(indexMCP, pinkyMCP).normalize(); 
        if(!isFrontCamera) palmAxisX.negate();
        const palmNormalZ = new THREE.Vector3().crossVectors(palmAxisX, armAxisY).normalize(); 
        palmAxisX.crossVectors(armAxisY, palmNormalZ).normalize(); 

        const rotationMatrix = new THREE.Matrix4();
        rotationMatrix.makeBasis(palmAxisX, armAxisY, palmNormalZ);
        targetQuaternion.setFromRotationMatrix(rotationMatrix);

        // Đẩy tâm lõi xuống cẳng tay
        const wristCore = wrist.clone();
        wristCore.add(armAxisY.clone().multiplyScalar(-palmSize * 0.5)); 
        targetPosition.copy(wristCore); 

        // CHỐNG LẬT TRỤC
        if (wristNode.quaternion.dot(targetQuaternion) < 0) {
            targetQuaternion.x = -targetQuaternion.x;
            targetQuaternion.y = -targetQuaternion.y;
            targetQuaternion.z = -targetQuaternion.z;
            targetQuaternion.w = -targetQuaternion.w;
        }

        if (!hasPreviousFrame) {
            wristNode.position.copy(targetPosition);
            wristNode.quaternion.copy(targetQuaternion);
            wristNode.visible = true;
            hasPreviousFrame = true;
        } else {
            wristNode.position.lerp(targetPosition, 0.4);
            wristNode.quaternion.slerp(targetQuaternion, 0.3);
        }

        // KHỐI TÀNG HÌNH CHUẨN: Lùi sâu vào da (Z = -0.15) để tuyệt đối không liếm vào vòng
        occluderMesh.scale.set(palmSize * 1.1, palmSize * 3.0, palmSize * 0.4);
        occluderMesh.position.set(0, 0, -palmSize * 0.15);

        // LIÊN KẾT THANH SLIDER ĐỂ VI CHỈNH
        if (artifactMesh) {
            const sScale = parseFloat(document.getElementById('scale-slider').value);
            const sPosX = parseFloat(document.getElementById('posX-slider').value);
            const sPosY = parseFloat(document.getElementById('posY-slider').value);
            const sPosZ = parseFloat(document.getElementById('posZ-slider').value);
            const sRotX = parseFloat(document.getElementById('rotX-slider').value);
            const sRotY = parseFloat(document.getElementById('rotY-slider').value);

            // Bọc gọn gàng
            const dynamicScale = sScale * (palmSize * 2.0);
            artifactMesh.scale.set(dynamicScale, dynamicScale, dynamicScale);
            
            // Xoay chuẩn góc trước
            artifactMesh.rotation.set(sRotX, sRotY, 0);
            
            // Dịch chuyển tâm theo không gian tay
            artifactMesh.position.set(palmSize * sPosX, palmSize * sPosY, palmSize * sPosZ);
        }

      } else {
        wristNode.visible = false;
        hasPreviousFrame = false; 
        statusBox.style.display = 'block';
        statusBox.innerHTML = "👋 Hãy xòe nhẹ bàn tay của bạn lên!";
      }
      renderer.render(scene, camera);
    });

    function startCamera() {
      if (cameraUtils) { cameraUtils.stop(); }
      videoElement.style.transform = isFrontCamera ? 'scaleX(-1)' : 'none';
      cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        facingMode: isFrontCamera ? 'user' : 'environment',
        width: 480, height: 360 
      });
      cameraUtils.start().catch(err => {
        statusBox.innerText = "❌ Lỗi: Không thể mở Camera!";
      });
    }

    document.getElementById('cam-btn').onclick = () => {
      isFrontCamera = !isFrontCamera;
      statusBox.style.display = 'block';
      statusBox.innerText = "🔄 Đang xoay Camera...";
      startCamera();
    };

    startCamera();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
