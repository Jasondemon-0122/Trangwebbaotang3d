<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Khám Phá - Xưởng Cầm Cổ Vật</title>
  
  <!-- CÔNG CỤ DEBUG MOBILE CHUYÊN SÂU (Sẽ hiện nút bánh răng ảo góc dưới phải màn hình điện thoại) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #1e293b; font-family: 'Segoe UI', Tahoma, sans-serif; touch-action: none; }
    #video-input { position: absolute; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
    #canvas-output { position: absolute; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    #status-box { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.85); color: #38bdf8; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: bold; white-space: nowrap; border: 1px solid #38bdf8; z-index: 10; pointer-events: none;}
    
    #ui-container { position: absolute; bottom: 20px; left: 0; width: 100vw; z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;}
    #control-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid #f59e0b; border-radius: 20px; padding: 15px 20px; width: calc(100vw - 40px); max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(150%); transition: 0.3s; pointer-events: auto; }
    #control-panel.show { transform: translateY(0); }
    
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; color: #cbd5e1; font-size: 11px; margin-bottom: 6px; font-weight: bold; text-transform: uppercase;}
    select, input[type=range] { width: 100%; background: #334155; color: white; border: 1px solid #475569; padding: 8px; border-radius: 8px; outline: none; }
    
    input[type=range] { -webkit-appearance: none; height: 20px; background: transparent; border: none; padding: 0;}
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -7px; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #475569; border-radius: 3px; }
    
    .fab-group { display: flex; gap: 20px; pointer-events: auto; margin-bottom: 10px;}
    .fab-btn { width: 50px; height: 50px; border-radius: 50%; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    #cam-btn { background: #334155; border: 2px solid #cbd5e1; }
    #settings-btn { background: linear-gradient(135deg, #f59e0b, #ea580c); border: 2px solid #fcd34d; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>

  <video id="video-input" autoplay playsinline muted></video>
  <canvas id="canvas-output"></canvas>
  <div id="status-box">⏳ Đang khởi tạo lõi AR...</div>

  <div id="ui-container">
    <div id="control-panel" class="show">
       <div class="input-group">
         <label>Loại cổ vật</label>
         <select id="artifact-type">
           <option value="bracelet">Vòng tay / Trang sức (Cổ tay)</option>
           <option value="weapon">Vũ khí / Cầm nắm (Lòng bàn tay)</option>
         </select>
       </div>
       <div class="input-group"><label>Phóng to/Thu nhỏ</label><input type="range" id="scale-slider" min="0.1" max="10" step="0.05" value="1.5"></div>
       <div class="input-group"><label>Xoay X (Lật đứng)</label><input type="range" id="rotX-slider" min="-3.14" max="3.14" step="0.01" value="1.57"></div>
       <div class="input-group"><label>Xoay Y (Xoay ngang)</label><input type="range" id="rotY-slider" min="-3.14" max="3.14" step="0.01" value="0"></div>
       <div class="input-group"><label>Xoay Z (Vặn tròn)</label><input type="range" id="rotZ-slider" min="-3.14" max="3.14" step="0.01" value="0"></div>
    </div>
    <div class="fab-group">
      <button id="cam-btn" class="fab-btn">🔄</button>
      <button id="settings-btn" class="fab-btn">⚙️</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    try {
        const videoElement = document.getElementById('video-input');
        const canvasElement = document.getElementById('canvas-output');
        const statusBox = document.getElementById('status-box');
        let isFrontCamera = true; 
        let cameraUtils = null;
        let currentModel = null;

        const ui = {
          type: document.getElementById('artifact-type'),
          scale: document.getElementById('scale-slider'),
          rotX: document.getElementById('rotX-slider'),
          rotY: document.getElementById('rotY-slider'),
          rotZ: document.getElementById('rotZ-slider')
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.z = 5;

        // TỐI ƯU 1: Giới hạn Pixel Ratio để cứu GPU khỏi màn hình Retina
        const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: false }); // Tắt antialias cứng
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        renderer.setSize(window.innerWidth, window.innerHeight);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 5, 5);
        scene.add(dirLight);

        const anchorNode = new THREE.Group(); scene.add(anchorNode); 
        anchorNode.visible = false; 
        const artifactOffset = new THREE.Group(); anchorNode.add(artifactOffset); 
        const artifactMesh = new THREE.Group(); artifactOffset.add(artifactMesh);
        
        // Giảm số lượng phân đoạn (segments) của khối tàng hình từ 32 xuống 16 để nhẹ GPU
        const occluderMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1, 16), new THREE.MeshBasicMaterial({ colorWrite: false }));
        occluderMesh.renderOrder = -1;   
        anchorNode.add(occluderMesh);

        function normalizeModelPivot() {
          if (!currentModel) return;
          const box = new THREE.Box3().setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          
          currentModel.scale.setScalar(1.0 / maxDim);
          if (ui.type.value === 'bracelet') {
            currentModel.position.set(-center.x / maxDim, -center.y / maxDim, -center.z / maxDim);
          } else {
            currentModel.position.set(-center.x / maxDim, -box.min.y / maxDim, -center.z / maxDim);
          }
        }

        ui.type.addEventListener('change', normalizeModelPivot);

        const glbUrl = new URLSearchParams(window.location.search).get('model');
        if (glbUrl) {
          new GLTFLoader().load(glbUrl, (gltf) => {
             currentModel = gltf.scene;
             artifactMesh.add(currentModel);
             normalizeModelPivot();
          });
        }

        document.getElementById('settings-btn').onclick = () => document.getElementById('control-panel').classList.toggle('show');

        const _vWrist = new THREE.Vector3(); const _vMid = new THREE.Vector3();
        const _vIndex = new THREE.Vector3(); const _vPinky = new THREE.Vector3();
        const _armY = new THREE.Vector3(); const _palmX = new THREE.Vector3(); const _palmZ = new THREE.Vector3();
        const _targetPos = new THREE.Vector3(); const _targetQuat = new THREE.Quaternion();
        const _rotationMatrix = new THREE.Matrix4(); const _camDir = new THREE.Vector3();
        
        let lastHandTime = 0;
        const TRACKING_TIMEOUT = 150; 
        let hasPrev = false;

        // TỐI ƯU 2: Bộ đếm thời gian (Clock) cho Delta-Time
        const clock = new THREE.Clock();

        // TỐI ƯU 3: Hạ modelComplexity xuống 0 để tránh nóng máy
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

        const getRaw3D = (outVec, landmark) => outVec.set(isFrontCamera ? -landmark.x : landmark.x, -landmark.y, -landmark.z);
        const get3DPos = (outVec, landmark) => {
          let v = new THREE.Vector3(isFrontCamera ? ((1 - landmark.x) * 2) - 1 : (landmark.x * 2) - 1, -(landmark.y * 2) + 1, 0.5).unproject(camera);
          const dir = v.sub(camera.position).normalize();
          if (Math.abs(dir.z) < 0.00001) dir.z = 0.00001 * Math.sign(dir.z || 1);
          outVec.copy(camera.position).add(dir.multiplyScalar(-camera.position.z / dir.z));
        };

        const isValidVector = (v) => Number.isFinite(v.x) && Number.isFinite(v.y) && Number.isFinite(v.z);
        const isValidQuat = (q) => Number.isFinite(q.x) && Number.isFinite(q.y) && Number.isFinite(q.z) && Number.isFinite(q.w);

        hands.onResults((results) => {
          if (results.multiHandLandmarks?.length > 0) {
            statusBox.style.display = 'none';
            const lm = results.multiHandLandmarks[0];
            
            getRaw3D(_vWrist, lm[0]); getRaw3D(_vMid, lm[9]);
            getRaw3D(_vIndex, lm[5]); getRaw3D(_vPinky, lm[17]);
            
            _armY.subVectors(_vMid, _vWrist);
            _palmX.subVectors(_vIndex, _vPinky);

            if (_armY.lengthSq() < 0.0001 || _palmX.lengthSq() < 0.0001) return;

            _armY.normalize(); _palmX.normalize();
            if(!isFrontCamera) _palmX.negate();
            
            _palmZ.crossVectors(_palmX, _armY);
            if (_palmZ.lengthSq() < 0.0001) return;

            _palmZ.normalize();
            _palmX.crossVectors(_armY, _palmZ).normalize(); 

            _rotationMatrix.makeBasis(_palmX, _armY, _palmZ);
            
            const tempQuat = new THREE.Quaternion().setFromRotationMatrix(_rotationMatrix);
            get3DPos(_vWrist, lm[0]); get3DPos(_vMid, lm[9]);
            const handSize = _vWrist.distanceTo(_vMid);
            
            camera.getWorldDirection(_camDir);
            const tempPos = _vWrist.clone();

            if (ui.type.value === 'bracelet') {
                tempPos.addScaledVector(_armY, -handSize * 0.3); 
                occluderMesh.scale.set(handSize * 1.5, handSize * 4.0, handSize * 1.5);
                occluderMesh.position.set(0, -handSize * 1.0, 0); 
            } else {
                tempPos.addScaledVector(_armY, handSize * 0.5);
                occluderMesh.scale.set(handSize * 1.5, handSize * 1.5, handSize * 1.2);
                occluderMesh.position.set(0, 0, 0);
            }

            if (!isValidVector(tempPos) || !isValidQuat(tempQuat)) return;

            lastHandTime = Date.now();
            _targetPos.copy(tempPos);
            _targetQuat.copy(tempQuat);

            artifactOffset.scale.setScalar(parseFloat(ui.scale.value) * handSize * 3.0);
            artifactOffset.rotation.set(parseFloat(ui.rotX.value), parseFloat(ui.rotY.value), parseFloat(ui.rotZ.value));
          }
        });

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const currentTime = Date.now();
            
            if (currentTime - lastHandTime > TRACKING_TIMEOUT) {
                anchorNode.visible = false;
                hasPrev = false;
                if (statusBox.style.display === 'none') {
                    statusBox.style.display = 'block'; 
                    statusBox.innerHTML = "👋 Hãy xòe nhẹ bàn tay của bạn lên!"; 
                }
            } else {
                // SỬA LỖI TẠI ĐÂY: Đảo ngược Quaternion thủ công thay vì dùng .negate()
                if (anchorNode.quaternion.dot(_targetQuat) < 0) {
                    _targetQuat.set(-_targetQuat.x, -_targetQuat.y, -_targetQuat.z, -_targetQuat.w);
                }

                if (!hasPrev) { 
                    anchorNode.position.copy(_targetPos); 
                    anchorNode.quaternion.copy(_targetQuat); 
                    anchorNode.visible = true; 
                    hasPrev = true; 
                } else { 
                    const lerpFactor = 1 - Math.exp(-15 * delta); 
                    anchorNode.position.lerp(_targetPos, lerpFactor); 
                    anchorNode.quaternion.slerp(_targetQuat, lerpFactor * 0.8); 
                }
            }

            renderer.render(scene, camera);
        }

        function startCamera() {
          if (cameraUtils) cameraUtils.stop();
          videoElement.style.transform = isFrontCamera ? 'scaleX(-1)' : 'none';
          // TỐI ƯU 5: Yêu cầu kích thước luồng video nhỏ hơn để AI tính toán nhanh hơn (Render CSS vẫn full màn hình)
          cameraUtils = new Camera(videoElement, { 
              onFrame: async () => { try { await hands.send({image: videoElement}); } catch(e) {} }, 
              facingMode: isFrontCamera ? 'user' : 'environment', width: 480, height: 360 
          });
          cameraUtils.start();
        }

        document.getElementById('cam-btn').onclick = () => { isFrontCamera = !isFrontCamera; startCamera(); };
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);

        animate(); 
        startCamera();
        
    } catch (criticalError) {
        console.error("LỖI KHỞI TẠO HỆ THỐNG:", criticalError);
    }
  </script>
</body>
</html>
